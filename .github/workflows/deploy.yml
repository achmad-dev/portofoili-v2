name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which parts of the codebase changed ──────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.manual.outputs.all }}
      backend: ${{ steps.filter.outputs.backend || steps.manual.outputs.all }}
    steps:
      - uses: actions/checkout@v4

      # On manual dispatch — deploy everything
      - name: Set manual trigger flag
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "all=true" >> $GITHUB_OUTPUT

      # On push — only detect changed paths
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            frontend:
              - 'client/**'
            backend:
              - 'backend/**'

  # ── Deploy frontend to GitHub Pages ─────────────────────────────────────────
  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_HMAC_SECRET: ${{ secrets.VITE_HMAC_SECRET }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - uses: actions/deploy-pages@v4
        id: deployment

  # ── Build Docker image & push to GitHub Container Registry ──────────────────
  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Pull pre-built image on EC2 & restart container ─────────────────────────
  deploy-backend:
    needs: [detect-changes, build-backend]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Pull image & restart container on EC2
        env:
          IMAGE: ghcr.io/${{ github.repository }}/backend:latest
          PORT: ${{ vars.BACKEND_PORT || '8080' }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            # Authenticate to GHCR so EC2 can pull the private image
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Write runtime env vars
            cat > /home/${{ secrets.EC2_USER }}/app/.env << 'ENVEOF'
          HOST=0.0.0.0
          PORT=${PORT}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          HMAC_SECRET=${{ secrets.HMAC_SECRET }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          ENVEOF

            # Pull the exact image built in the previous job
            docker pull ${IMAGE}

            # Gracefully replace the running container
            docker stop portfolio-backend 2>/dev/null || true
            docker rm   portfolio-backend 2>/dev/null || true
            docker run -d \
              --name portfolio-backend \
              --restart unless-stopped \
              --env-file /home/${{ secrets.EC2_USER }}/app/.env \
              -p ${PORT}:${PORT} \
              ${IMAGE}

            # Remove old images to free disk space
            docker image prune -f
          EOF
